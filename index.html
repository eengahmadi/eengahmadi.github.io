<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. VIDEO BACKGROUND -->
    <video autoplay muted loop id="background-video">
        <source src="BG_video.mp4" type="video/mp4">
    </video>

    <!-- 2. THE MAIN CONTENT CONTAINER -->
    <div class="content-wrapper">
        
        <!-- HERO SECTION (The top part visible immediately) -->
        <section id="hero" class="section">
            <div class="content">
                <h1>Hello! I'm Eeng</h1>
                <p>A Realtime VFX Artist and 3D Generalist.</p>
                <a href="#projects" class="cta-button">View My Work</a>
            </div>
        </section>

        <!-- ABOUT SECTION (This is where we need a target ID) -->
        <section id="about" class="section">
            <div class="content">
                <h2>About Me</h2>
                <p>I am passionate about creating beautiful and optimized VFX. I specialize Unreal engine.</p>
            </div>
        </section>

        <!-- PROJECTS SECTION (This is the target for the link) -->
       <section id="projects" class="section">
    <div class="content">
        <h2>My Projects Showcase</h2>
        
        <!-- PROJECT 1: Clickable Trigger -->
        <div class="project-item">
            <h3>Project Alpha</h3>
            <p>A description of Project Alpha.</p>
            <!-- The button that triggers the video -->
            <button class="play-button" data-video-src="video1.mp4">Play Project Video</button>
            
            <!-- The video that will be shown -->
            <video class="project-video" id="video1" src="video1.mp4" poster="thumbnail1.jpg"></video>
        </div>

        <!-- PROJECT 2: Clickable Trigger -->
        <div class="project-item">
            <h3>Project Beta</h3>
            <p>A description of Project Beta.</p>
            <button class="play-button" data-video-src="BG_video.mp4">Play Project Video</button>
            <video class="project-video" id="video2" src="BG_video.mp4" poster="thumbnail2.jpg"></video>
        </div>

    </div>
</section>

    </div>

<!-- ... (End of all your content) ... -->

    <!-- 4. LINK THE JAVASCRIPT FILE -->
    <script src="script.js"></script> 
</body>
</html>
