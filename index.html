<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. VIDEO BACKGROUND -->
    <video autoplay muted loop id="background-video">
        <source src="BG_video.mp4" type="video/mp4">
    </video>

    <!-- 2. THE MAIN CONTENT CONTAINER -->
    <div class="content-wrapper">
        
        <!-- HERO SECTION (The top part visible immediately) -->
        <section id="hero" class="section">
            <div class="content">
                <h1>Hello! I'm Eeng</h1>
                <p>A Realtime VFX Artist and 3D Generalist.</p>
                <a href="#projects" class="cta-button">View My Work</a>
            </div>
        </section>

        <!-- ABOUT SECTION (This is where we need a target ID) -->
        <section id="about" class="section">
            <div class="content">
                <h2>About Me</h2>
                <p>I am passionate about creating beautiful and optimized VFX. I specialize Unreal engine.</p>
            </div>
        </section>

        <!-- PROJECTS SECTION (This is the target for the link) -->
        <section id="projects" class="section">
            <div class="content">
                <h2>My Portfolios</h2>
                <p>Check out some of the work I have done:</p>
                <!-- You would add your project cards here later -->
                <ul>
                    <li>Project 1 (Coming Soon)</li>
                    <li>Project 2 (Coming Soon)</li>
                </ul>
            </div>
        </section>

    </div>

</body>
</html>
